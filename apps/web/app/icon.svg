<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Tor-Sockets mark: the 3-hop circuit (guard → middle → exit) on amethyst. -->
  <rect width="32" height="32" rx="8" fill="#9c5fd6" />
  <line x1="9" y1="16" x2="23" y2="16" stroke="#1c1030" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="9" cy="16" r="3.2" fill="#5b9bd5" />
  <circle cx="16" cy="16" r="3.2" fill="#9aa0aa" />
  <circle cx="23" cy="16" r="3.2" fill="#e8b15e" />
</svg>
